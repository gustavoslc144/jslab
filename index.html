<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSLab | Pedidos</title>

    <script src="assets/js/dados.js" defer></script>
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>JSLab</h1>
        <p>Pedidos de serviço</p>
    </header>

    <main>

        <section aria-labelledby="titulo-pedidos">

            <h2 id="titulo-pedidos">
                Pedidos
            </h2>

            <p id="resumo">
                Carregando dados...
            </p>

            <label for="campo-busca">
                Pesquisar pedidos
            </label>

            <input
                id="campo-busca"
                type="search"
                placeholder="Digite um cliente, status ou prioridade"
            >

            <label for="filtro-status">Status</label>

            <select id="filtro-status">
                <option value="todos">Todos</option>
                <option value="aberto">Aberto</option>
                <option value="atendimento">Em atendimento</option>
                <option value="concluido">Concluído</option>
            </select>

            <label for="ordenacao">Ordenar</label>

            <select id="ordenacao">
                <option value="cliente">Cliente</option>
                <option value="valor-crescente">Menor valor</option>
                <option value="valor-decrescente">Maior valor</option>
            </select>

            <div id="lista-pedidos"></div>

        </section>

        <!--
        <button id="botao-teste">Testar evento</button>
        -->

    </main>

</body>

</html>
